name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches Apple's /usr/bin/python3, the app's last fallback.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Actieve DJ Jev-kern (demo/)
        working-directory: demo
        run: python -m unittest discover -s tests -v
      - name: Oudere bridge- en scripttests
        run: python -m unittest discover -s tests -v

  macos:
    # Tests guarded by sys.platform == 'darwin' (such as the Swift/AppKit
    # marker-alignment matcher) are skipped on Ubuntu; run them natively here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Swift-toolchain
        run: swiftc --version
      - name: Vergelijk de klok van de Swift-bridge met die van Python
        # The bridge stamps frames with DispatchTime uptime and policy.py
        # rejects frames more than 3 s away from Python's time.monotonic_ns.
        shell: bash
        run: |
          printf 'import Dispatch\nprint(DispatchTime.now().uptimeNanoseconds)\n' > "$RUNNER_TEMP/clock.swift"
          swiftc "$RUNNER_TEMP/clock.swift" -o "$RUNNER_TEMP/clock"
          for py in /usr/bin/python3 python; do
            before=$("$RUNNER_TEMP/clock")
            py_ns=$("$py" -c 'import time; print(time.monotonic_ns())')
            after=$("$RUNNER_TEMP/clock")
            echo "$py ($("$py" --version 2>&1)): swift=$before..$after python=$py_ns"
            # Same clock: the Python reading lies between the two Swift readings.
            if ! "$py" -c "import sys; sys.exit(0 if $before - 50_000_000 <= $py_ns <= $after + 50_000_000 else 1)"; then
              echo "::warning::$py gebruikt een andere monotone klok dan de Swift-bridge"
            fi
          done
      - name: Actieve kern met Apple's /usr/bin/python3 (terugvaloptie van de app)
        working-directory: demo
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests
      - name: Actieve DJ Jev-kern (demo/)
        working-directory: demo
        run: python -m unittest discover -s tests -v
      - name: Bridge- en scripttests inclusief Swift marker-alignment
        # Explicit bash enables pipefail, so a failing suite is not masked by tee.
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      - name: Controleer dat de Swift marker-alignmenttest echt draaide
        shell: bash
        run: grep -E "^test_marker_alignment_cases .* ok$" "$RUNNER_TEMP/test-output.txt"
