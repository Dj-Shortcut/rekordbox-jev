name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches Apple's /usr/bin/python3, the app's last fallback.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Actieve DJ Jev-kern (demo/)
        working-directory: demo
        run: python -m unittest discover -s tests -v
      - name: Oudere bridge- en scripttests
        run: python -m unittest discover -s tests -v

  macos:
    # Tests guarded by sys.platform == 'darwin' (such as the Swift/AppKit
    # marker-alignment matcher) are skipped on Ubuntu; run them natively here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Swift-toolchain
        run: swiftc --version
      - name: Controleer dat de Python-kant de klok van de Swift-bridge volgt
        # The bridge stamps frames and checks deadlines with DispatchTime
        # uptime; djjev.clock.bridge_ns() must agree with it on every Python
        # the app may launch, including Apple's /usr/bin/python3.
        shell: bash
        working-directory: demo
        run: |
          printf 'import Dispatch\nprint(DispatchTime.now().uptimeNanoseconds)\n' > "$RUNNER_TEMP/clock.swift"
          swiftc "$RUNNER_TEMP/clock.swift" -o "$RUNNER_TEMP/clock"
          for py in /usr/bin/python3 python; do
            before=$("$RUNNER_TEMP/clock")
            read -r raw_ns bridge_ns < <("$py" -c 'import time; from djjev.clock import bridge_ns; print(time.monotonic_ns(), bridge_ns())')
            after=$("$RUNNER_TEMP/clock")
            echo "$py ($("$py" --version 2>&1)): swift=$before..$after monotonic_ns=$raw_ns bridge_ns=$bridge_ns"
            "$py" -c "import sys; sys.exit(0 if $before - 50_000_000 <= $bridge_ns <= $after + 50_000_000 else 1)" \
              || { echo "::error::$py: bridge_ns() volgt de klok van de Swift-bridge niet"; exit 1; }
          done
      - name: Actieve kern met Apple's /usr/bin/python3 (terugvaloptie van de app)
        working-directory: demo
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests
      - name: Actieve DJ Jev-kern (demo/)
        working-directory: demo
        run: python -m unittest discover -s tests -v
      - name: Bridge- en scripttests inclusief native bediening en widget
        # Explicit bash enables pipefail, so a failing suite is not masked by tee.
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      - name: Controleer dat de drie Mac-controles echt draaiden
        shell: bash
        run: |
          grep -E "^test_marker_alignment_cases .* ok$" "$RUNNER_TEMP/test-output.txt"
          grep -E "^test_native_transport_cases .* ok$" "$RUNNER_TEMP/test-output.txt"
          grep -E "^test_widget_typecheck .* ok$" "$RUNNER_TEMP/test-output.txt"
